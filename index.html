<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8c6d0">
<title>نظام المدثر وحرزو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
:root{--bg:#b8c6d0;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--primary:#0e7490;--primary-soft:#e0f2f7;--accent:#f59e0b;--ok:#16a34a;--ok-soft:#e7f7ec;--warn:#d97706;--warn-soft:#fff4e0;--bad:#dc2626;--bad-soft:#fdeaea;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* دخول */
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.login h1{font-size:22px;margin:0 0 4px}.login p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn{display:inline-block;padding:11px 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}.btn.block{width:100%;margin-top:16px}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}.btn.sm{padding:6px 12px;font-size:14px}
.err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:10px;margin-top:12px;font-size:14px}
/* الهيكل */
header.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--accent);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;flex:1;min-width:120px}
header.top select{width:auto;padding:7px 10px}
header.top .who{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
nav.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:4px 0 12px}
/* الاستعلام */
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item .side{text-align:left;white-space:nowrap}
.price{font-weight:700;font-size:17px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.low{background:var(--warn-soft);color:var(--warn)}.badge.unavailable{background:var(--bad-soft);color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)}.empty{padding:28px 8px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;border-top:3px solid var(--primary);background:#fff}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:16px;cursor:pointer}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ضع هنا رابط تطبيق الويب (ينتهي بـ /exec) مكان الكلمات الإنجليزية بين علامتي الاقتباس
window.APP_CONFIG = { API_URL: 'PUT_WEB_APP_URL_HERE' };
</script>
<script>
'use strict';
var PAGES = {
  dashboard:'لوحة المعلومات', sales:'فاتورة مبيعات', inquiry:'الاستعلام عن الرصيد', stock:'المخزون', items:'الأصناف',
  purchases:'المشتريات', suppliers:'الموردون', customers:'العملاء', returns:'المرتجعات', expenses:'المصروفات والإيرادات',
  accounts:'الخزينة والبنك', reports:'التقارير', export:'التصدير', users:'المستخدمون', settings:'الإعدادات', audit:'سجل المراجعة'
};
var ROLES = { admin:'مدير النظام', manager:'مدير المحل', accountant:'محاسب', stock:'مسؤول المخزون', seller:'بائع' };
var S = { token: null, me: null, family: '', page: '' };
var $app = document.getElementById('app');

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; setTimeout(function(){ t.className = ''; }, 2600); }
function saveToken(t){ try { if (t) localStorage.setItem('mh_token', t); else localStorage.removeItem('mh_token'); } catch (e) {} }
function loadToken(){ try { return localStorage.getItem('mh_token'); } catch (e) { return null; } }

function api(action, data){
  var url = (window.APP_CONFIG || {}).API_URL;
  if (!url || url.indexOf('PUT_WEB_APP_URL') === 0) return Promise.reject(new Error('لم يُضبط رابط الخادم في config.js'));
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: S.token, data: data || {} }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) { if (j.error === 'auth' && S.token) { logoutLocal(); } var e = new Error(j.message || 'خطأ'); e.code = j.error; throw e; }
      return j;
    });
}

function logoutLocal(){ S.token = null; S.me = null; saveToken(null); renderLogin(); }

/* ---------- الدخول ---------- */
function renderLogin(msg){
  $app.innerHTML = '<div class="login"><div class="card"><h1>نظام المدثر وحرزو</h1><p>الأدوات الصحية ومعدات البناء</p>' +
    '<label for="u">اسم المستخدم</label><input id="u" autocomplete="username" autocapitalize="none" dir="ltr">' +
    '<label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" dir="ltr">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<button class="btn block" id="go">دخول</button></div></div>';
  var go = document.getElementById('go');
  function submit(){
    go.disabled = true; go.textContent = 'جارٍ الدخول...';
    api('login', { username: document.getElementById('u').value, password: document.getElementById('p').value })
      .then(function(j){ S.token = j.token; saveToken(j.token); start(j.me); })
      .catch(function(e){ renderLogin(e.message); });
  }
  go.onclick = submit;
  document.getElementById('p').onkeydown = function(e){ if (e.key === 'Enter') submit(); };
}

function start(me){
  S.me = me; S.family = me.families.length === 1 ? me.families[0].id : '';
  S.page = me.pages.indexOf('sales') >= 0 && me.role === 'seller' ? 'sales' : me.pages[0];
  renderShell();
}

function boot(){
  S.token = loadToken();
  if (!S.token) return renderLogin();
  api('me').then(function(j){ start(j.me); }).catch(function(e){ renderLogin(e.code === 'auth' ? '' : e.message); });
}

/* ---------- الهيكل ---------- */
function renderShell(){
  var me = S.me, famSel = '';
  if (me.families.length > 1) {
    famSel = '<select id="fam" aria-label="العائلة"><option value="">كل العائلات</option>' +
      me.families.map(function(f){ return '<option value="' + esc(f.id) + '"' + (S.family === f.id ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join('') + '</select>';
  } else if (me.families.length === 1) famSel = '<span class="badge ok">' + esc(me.families[0].name) + '</span>';
  $app.innerHTML = '<header class="top"><h1>المدثر وحرزو</h1>' + famSel +
    '<span class="who">' + esc(me.name) + ' · ' + esc(me.role_name) + '</span><button class="btn ghost sm" id="out">خروج</button></header>' +
    '<nav class="tabs">' + me.pages.map(function(p){ return '<button data-p="' + p + '"' + (p === S.page ? ' class="on"' : '') + '>' + esc(PAGES[p]) + '</button>'; }).join('') + '</nav>' +
    '<main id="main"></main>';
  var fam = document.getElementById('fam'); if (fam) fam.onchange = function(){ S.family = fam.value; renderPage(); };
  document.getElementById('out').onclick = function(){ api('logout').catch(function(){}).then(logoutLocal); };
  document.querySelector('nav.tabs').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return; S.page = b.getAttribute('data-p');
    [].forEach.call(document.querySelectorAll('nav.tabs button'), function(x){ x.className = x === b ? 'on' : ''; });
    renderPage();
  };
  renderPage();
}

function renderPage(){
  var m = document.getElementById('main');
  if (S.page === 'inquiry') return pageInquiry(m);
  if (S.page === 'users') return pageUsers(m);
  var P = { dashboard: pageDashboard, stock: pageStock, items: pageItems, suppliers: function(m){ pageParties(m, 'suppliers'); }, customers: function(m){ pageParties(m, 'customers'); }, accounts: pageAccounts, expenses: pageExpenses, audit: pageAudit, export: pageExport };
  if (P[S.page]) return P[S.page](m);
  if (S.page === 'sales') return pageSales(m);
  if (S.page === 'purchases') return pagePurchases(m);
  m.innerHTML = '<div class="card"><h2>' + esc(PAGES[S.page]) + '</h2><div class="empty">هذه الصفحة لم تُبنَ بعد، وستُضاف في مرحلة لاحقة.</div></div>';
}

/* ---------- الاستعلام عن الرصيد (قراءة فقط) ---------- */
var STATUS = { ok: 'متاح', low: 'وصل للحد الأدنى', unavailable: 'غير متاح' };
function pageInquiry(m){
  m.innerHTML = '<div class="card"><h2>الاستعلام عن الرصيد</h2><input id="q" type="search" placeholder="اكتب اسم الصنف أو كوده أو الباركود" autocomplete="off"><div id="res" class="muted" style="margin-top:10px"></div></div>';
  var q = document.getElementById('q'), res = document.getElementById('res'), timer, seq = 0;
  q.oninput = function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var v = q.value.trim(); if (!v) { res.innerHTML = ''; return; }
      var my = ++seq; res.textContent = 'جارٍ البحث...';
      api('searchItems', { q: v, family: S.family }).then(function(j){
        if (my !== seq) return;
        if (!j.items.length) { res.innerHTML = '<div class="empty">لا توجد نتائج</div>'; return; }
        res.innerHTML = j.items.map(function(it){
          return '<div class="item"><div><div class="nm">' + esc(it.name) + '</div><div class="meta">' + esc(it.code) + ' · ' + esc(it.family_name) + (it.unit ? ' · ' + esc(it.unit) : '') + '</div></div>' +
            '<div class="side"><div class="price">' + fmt(it.sell_price) + ' ج</div>' +
            '<div class="meta">الرصيد: ' + fmt(it.balance) + '</div><span class="badge ' + it.status + '">' + STATUS[it.status] + '</span></div></div>';
        }).join('');
      }).catch(function(e){ if (my === seq) res.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
    }, 300);
  };
  q.focus();
}

/* ---------- المستخدمون (مدير النظام) ---------- */
function pageUsers(m){
  m.innerHTML = '<div class="card"><h2>المستخدمون</h2><div id="ulist" class="muted">جارٍ التحميل...</div></div>' +
    '<div class="card" style="margin-top:12px"><h2 id="ftitle">إضافة مستخدم</h2><div id="uform"></div></div>';
  var users = [];
  function load(){
    api('listUsers').then(function(j){
      users = j.users;
      document.getElementById('ulist').innerHTML = '<div class="wrap"><table><tr><th>المستخدم</th><th>الدور</th><th>العائلات</th><th>الحالة</th><th></th></tr>' +
        users.map(function(u, i){ return '<tr><td>' + esc(u.name) + '<div class="meta muted" dir="ltr">' + esc(u.username) + '</div></td><td>' + esc(ROLES[u.role]) + '</td><td>' + esc(u.families || 'الكل') + '</td><td>' + (u.active ? 'مفعّل' : 'معطّل') +
          '</td><td><button class="btn ghost sm" data-e="' + i + '">تعديل</button> <button class="btn ghost sm" data-r="' + i + '">كلمة مرور</button></td></tr>'; }).join('') + '</table></div>';
    }).catch(function(e){ document.getElementById('ulist').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }
  function form(u){
    u = u || {};
    document.getElementById('ftitle').textContent = u.username ? 'تعديل المستخدم' : 'إضافة مستخدم';
    document.getElementById('uform').innerHTML =
      '<label>الاسم الكامل</label><input id="fn" value="' + esc(u.name || '') + '">' +
      '<label>اسم المستخدم (إنجليزي صغير)</label><input id="fu" dir="ltr" value="' + esc(u.username || '') + '"' + (u.username ? ' readonly' : '') + '>' +
      (u.username ? '' : '<label>كلمة المرور (8 أحرف على الأقل)</label><input id="fp" type="password" dir="ltr">') +
      '<div class="row2"><div><label>الدور</label><select id="fr">' + Object.keys(ROLES).map(function(r){ return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + ROLES[r] + '</option>'; }).join('') + '</select></div>' +
      '<div><label>أقصى خصم %</label><input id="fd" type="number" min="0" max="100" value="' + esc(u.max_discount_pct || 0) + '"></div></div>' +
      '<label>العائلات المسموحة</label><select id="ff"><option value="MD,HZ">العائلتان (المدثر وحرزو)</option><option value="MD">المدثر فقط</option><option value="HZ">حرزو فقط</option></select>' +
      '<label><input type="checkbox" id="fc" style="width:auto"' + (u.allow_credit ? ' checked' : '') + '> يسمح بالبيع الآجل</label>' +
      (u.username ? '<label><input type="checkbox" id="fa" style="width:auto"' + (u.active ? ' checked' : '') + '> الحساب مفعّل</label>' : '') +
      '<button class="btn block" id="fs">حفظ</button>';
    if (u.families) document.getElementById('ff').value = u.families;
    document.getElementById('fs').onclick = function(){
      var d = { full_name: val('fn'), username: val('fu'), role: val('fr'), max_discount_pct: Number(val('fd')), families: val('ff'), allow_credit: document.getElementById('fc').checked };
      if (u.username) d.active = document.getElementById('fa').checked; else d.password = val('fp');
      api('saveUser', d).then(function(){ toast('تم الحفظ'); form(); load(); }).catch(function(e){ toast(e.message); });
    };
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }
  m.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-e')) form(users[b.getAttribute('data-e')]);
    if (b.hasAttribute('data-r')) {
      var u = users[b.getAttribute('data-r')], pw = prompt('كلمة المرور الجديدة لـ ' + u.name + ' (8 أحرف على الأقل)');
      if (pw) api('resetPassword', { user_id: u.user_id, password: pw }).then(function(){ toast('تم تغيير كلمة المرور'); }).catch(function(e2){ toast(e2.message); });
    }
  };
  form(); load();
}

/* ---------- صفحات الإدارة ---------- */
var fmt = function(n){ return Math.round(Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); };
var $id = function(i){ return document.getElementById(i); };
function tbl(head, rows){ return '<div class="wrap"><table><tr>' + head.map(function(x){ return '<th>' + esc(x) + '</th>'; }).join('') + '</tr>' + rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>'; }
function box(m, title, html){ m.innerHTML = '<div class="card"><h2>' + esc(title) + '</h2>' + html + '</div>'; }
function load(m, title, action, data, render){
  box(m, title, '<div class="muted">جارٍ التحميل...</div>');
  api(action, data).then(function(j){ box(m, title, render(j)); }).catch(function(e){ box(m, title, '<div class="err">' + esc(e.message) + '</div>'); });
}
function accTable(a){ return tbl(['الحساب', 'الرصيد', 'ملاحظة'], a.map(function(x){ return [x.name, fmt(x.balance), x.confirmed ? '' : 'الرصيد الافتتاحي غير مؤكد']; })); }
function famOptions(){ return S.me.families.map(function(f){ return '<option value="' + esc(f.id) + '"' + (S.family === f.id ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join(''); }

function pageDashboard(m){
  load(m, 'لوحة المعلومات', 'dashboard', { family: S.family }, function(j){
    var k = j.kpis, c = [['مبيعات اليوم', k.sales_today], ['مبيعات الشهر', k.sales_month], ['فواتير الشهر', k.count_month], ['مشتريات الشهر', k.purchases_month], ['مصروفات الشهر', k.expenses_month], ['مجمل ربح الشهر', k.gross_profit_month], ['صافي ربح الشهر', k.net_profit_month], ['مستحق من العملاء', k.receivables], ['مستحق للموردين', k.payables], ['المخزون بالتكلفة', k.stock_value]];
    return '<div class="kpis">' + c.map(function(x){ return '<div class="kpi"><div class="muted">' + x[0] + '</div><div class="price">' + fmt(x[1]) + '</div></div>'; }).join('') + '</div><h2 style="margin-top:16px">الأرصدة المالية</h2>' + accTable(j.accounts) +
      '<div class="muted" style="margin-top:8px">الأرقام من العمليات المسجلة فقط، والمرتجعات لم تُحتسب لأن صفحتها لم تُبنَ بعد.</div>';
  });
}
function pageAccounts(m){ load(m, 'الخزينة والبنك والمحافظ', 'accounts', { family: S.family }, function(j){ return accTable(j.accounts); }); }
function pageAudit(m){
  load(m, 'سجل المراجعة', 'audit', {}, function(j){ return tbl(['الوقت', 'المستخدم', 'العملية', 'المرجع', 'تفاصيل'], j.rows.map(function(r){ return [new Date(r.time).toLocaleString('ar-EG'), r.user, r.action, r.id, r.details]; })); });
}
function famName(id){ var f = S.me.families.filter(function(x){ return x.id === id; })[0]; return f ? f.name : id; }
function pageParties(m, kind){
  var sup = kind === 'suppliers', lab = sup ? 'مورد' : 'عميل', list = [];
  m.innerHTML = '<div class="card"><h2>' + (sup ? 'الموردون' : 'العملاء') + '</h2><div id="pl" class="muted">جارٍ التحميل...</div></div><div class="card hide" style="margin-top:12px" id="pset"></div><div class="card" style="margin-top:12px"><h2 id="pft"></h2><div id="pf"></div></div>';
  function load(){
    api(sup ? 'listSuppliers' : 'listCustomers', { family: S.family }).then(function(j){
      list = j.rows;
      $id('pl').innerHTML = '<div class="wrap"><table><tr><th>الاسم</th><th>العائلة</th><th>الهاتف</th><th>المستحق</th><th></th></tr>' + list.map(function(r, i){
        return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.family_name) + '</td><td>' + esc(r.phone) + '</td><td>' + fmt(r.balance) + '</td><td><button class="btn ghost sm" data-s="' + i + '">' + (sup ? 'سداد' : 'تحصيل') + '</button> <button class="btn ghost sm" data-e="' + i + '">تعديل</button> <button class="btn ghost sm" data-d="' + i + '">حذف</button></td></tr>'; }).join('') + '</table></div>';
    }).catch(function(e){ $id('pl').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }
  function form(p){
    p = p || {}; $id('pft').textContent = p.id ? 'تعديل ' + lab : 'إضافة ' + lab;
    $id('pf').innerHTML = '<label>العائلة</label><select id="pf_f"' + (p.id ? ' disabled' : '') + '>' + famOptions() + '</select><label>الاسم</label><input id="pf_n" value="' + esc(p.name || '') + '">' +
      '<div class="row2"><div><label>الهاتف</label><input id="pf_p" dir="ltr" inputmode="tel" value="' + esc(p.phone || '') + '"></div><div><label>الرصيد الافتتاحي</label><input id="pf_o" type="number" min="0" value="0"' + (p.id ? ' disabled' : '') + '></div></div><button class="btn block" id="pf_s">حفظ</button>';
    if (p.family) $id('pf_f').value = p.family;
    $id('pf_s').onclick = function(){

  $('pm').onchange = function(){ $('pw').className = $('pm').value === 'credit' ? '' : 'hide'; };
  function setFam(f){ $('sf').value = f; [].forEach.call(m.querySelectorAll('.seg button'), function(b){ b.className = b.getAttribute('data-f') === f ? 'on' : ''; }); cart = []; $('sr').innerHTML = ''; draw(); }
  setFam($('sf').value);
  var timer;
  $('sq').oninput = function(){
    clearTimeout(timer); var v = $('sq').value.trim();
    timer = setTimeout(function(){
      if (!v || !fam()) { $('sr').innerHTML = fam() ? '' : '<div class="muted">اختر العائلة أولًا</div>'; return; }
      api('searchItems', { q: v, family: fam() }).then(function(j){
        $('sr').innerHTML = j.items.slice(0, 15).map(function(it, i){ return '<div class="item"><div><div class="nm">' + esc(it.name) + '</div><div class="meta">' + esc(it.code) + ' · الرصيد ' + fmt(it.balance) + ' · ' + fmt(it.sell_price) + ' ج</div></div><button class="btn ghost sm" data-a="' + i + '">إضافة</button></div>'; }).join('') || '<div class="empty">لا نتائج</div>';
        $('sr')._items = j.items;
      }).catch(function(e){ $('sr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
    }, 300);
  };
  m.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-f')) setFam(b.getAttribute('data-f'));
    if (b.hasAttribute('data-a')) { var it = $('sr')._items[b.getAttribute('data-a')]; var ex = cart.filter(function(l){ return l.code === it.code; })[0]; if (ex) ex.qty += 1; else cart.push({ code: it.code, name: it.name, qty: 1, price: it.sell_price, disc: 0 }); draw(); }
    if (b.hasAttribute('data-x')) { cart.splice(b.getAttribute('data-x'), 1); draw(); }
  };
  m.oninput = function(e){
    var t = e.target; if (t.hasAttribute('data-q')) cart[t.getAttribute('data-q')].qty = Number(t.value);
    if (t.hasAttribute('data-d')) cart[t.getAttribute('data-d')].disc = Number(t.value);
    if (t.hasAttribute('data-q') || t.hasAttribute('data-d')) { var tt = 0; cart.forEach(function(l){ tt += Math.round(l.qty * l.price * (1 - l.disc / 100)); }); $('tot').textContent = 'الإجمالي: ' + fmt(tt) + ' ج'; }
  };
  $('sv').onclick = function(){
    if (busy) return;
    if (!fam()) return toast('اختر العائلة');
    if (!reqId) reqId = uid();               // نفس المعرّف عند إعادة المحاولة يمنع تكرار الفاتورة
    busy = true; $('sv').disabled = true;
    api('createInvoice', { request_id: reqId, family: fam(), customer_name: $('cn').value, phone: $('cp').value, payment_method: $('pm').value, paid: Number($('pd').value || 0),
      lines: cart.map(function(l){ return { code: l.code, qty: l.qty, discount_pct: l.disc }; }) })
      .then(function(j){ $('msg').innerHTML = '<div class="badge ok" style="margin-top:12px">تم حفظ الفاتورة ' + esc(j.invoice_no) + ' · الإجمالي ' + j.total + ' · المتبقي ' + j.remaining + '</div>'; cart = []; reqId = null; draw(); })
      .catch(function(e){ $('msg').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; })
      .then(function(){ busy = false; $('sv').disabled = false; });
  };
  draw();
}

/* ---------- فاتورة مشتريات ---------- */
function pagePurchases(m){
  var fams = S.me.families, cart = [], busy = false, $ = function(id){ return document.getElementById(id); };
  m.innerHTML = '<div class="card"><h2>فاتورة مشتريات</h2><label>العائلة</label><select id="pf">' + (fams.length > 1 ? '<option value="">اختر العائلة</option>' : '') + fams.map(function(f){ return '<option value="' + esc(f.id) + '"' + (S.family === f.id || fams.length === 1 ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join('') + '</select>' +
    '<div class="row2"><div><label>المورد</label><input id="pn"></div><div><label>رقم فاتورة المورد</label><input id="po" dir="ltr"></div></div>' +
    '<label>ابحث عن صنف</label><input id="pq" type="search" autocomplete="off"><div id="pr"></div></div>' +
    '<div class="card" style="margin-top:12px"><div id="pc" class="muted">لا توجد بنود</div><div class="row2"><div><label>مصروفات إضافية</label><input id="px" type="number" min="0" value="0"></div>' +
    '<div><label>طريقة الدفع</label><select id="pm"><option value="credit">آجل / جزئي</option><option value="cash">نقدي</option><option value="bank">بنك</option><option value="wallet">محفظة</option></select></div></div>' +
    '<label>المدفوع (للآجل)</label><input id="pd" type="number" min="0" value="0"><button class="btn block" id="ps">حفظ الفاتورة</button><div id="pg"></div></div>';
  function draw(){ $('pc').innerHTML = cart.length ? '<div class="wrap"><table><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th></th></tr>' + cart.map(function(l, i){ return '<tr><td>' + esc(l.name) + '</td><td><input data-q="' + i + '" type="number" min="0" step="any" value="' + l.qty + '" style="width:70px"></td><td><input data-c="' + i + '" type="number" min="0" step="any" value="' + l.cost + '" style="width:80px"></td><td><button class="btn ghost sm" data-x="' + i + '">حذف</button></td></tr>'; }).join('') + '</table></div>' : 'لا توجد بنود'; }
  var timer; $('pq').oninput = function(){ clearTimeout(timer); timer = setTimeout(function(){ var v = $('pq').value.trim(); if (!v || !$('pf').value) { $('pr').innerHTML = ''; return; }
    api('searchItems', { q: v, family: $('pf').value }).then(function(j){ $('pr')._i = j.items; $('pr').innerHTML = j.items.slice(0, 15).map(function(it, i){ return '<div class="item"><div class="nm">' + esc(it.name) + '<div class="meta">' + esc(it.code) + '</div></div><button class="btn ghost sm" data-a="' + i + '">إضافة</button></div>'; }).join(''); }).catch(function(e){ $('pr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }); }, 300); };
  $('pf').onchange = function(){ cart = []; draw(); };
  m.onclick = function(e){ var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-a')) { var it = $('pr')._i[b.getAttribute('data-a')]; cart.push({ code: it.code, name: it.name, qty: 1, cost: 0 }); draw(); }
    if (b.hasAttribute('data-x')) { cart.splice(b.getAttribute('data-x'), 1); draw(); } };
  m.oninput = function(e){ var t = e.target; if (t.hasAttribute('data-q')) cart[t.getAttribute('data-q')].qty = Number(t.value); if (t.hasAttribute('data-c')) cart[t.getAttribute('data-c')].cost = Number(t.value); };
  $('ps').onclick = function(){ if (busy) return; busy = true; $('ps').disabled = true;
    api('createPurchase', { family: $('pf').value, supplier_name: $('pn').value, supplier_invoice_no: $('po').value, extra_costs: Number($('px').value || 0), payment_method: $('pm').value, paid: Number($('pd').value || 0),
      lines: cart.map(function(l){ return { code: l.code, qty: l.qty, unit_cost: l.cost }; }) })
      .then(function(j){ $('pg').innerHTML = '<div class="badge ok" style="margin-top:12px">تم حفظ ' + esc(j.invoice_no) + ' · الإجمالي ' + j.total + ' · المتبقي للمورد ' + j.remaining + '</div>'; cart = []; draw(); })
      .catch(function(e){ $('pg').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; })
      .then(function(){ busy = false; $('ps').disabled = false; }); };
  draw();
}

boot();
</script>
